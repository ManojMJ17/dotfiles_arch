# Song title
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --title; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = Open Sans Bold
    position = 760, 118
    halign = center
    valign = bottom
    zindex = 1
}

# Player source
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --player; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 13
    font_family = Open Sans Bold
    position = -18, 25
    halign = right
    valign = bottom
    zindex = 1
}

# Artist
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then echo "󰠃  $(~/.config/hypr/Scripts/hyprlock-music.sh --artist)"; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Open Sans Semibold
    position = 760, 98
    halign = center
    valign = bottom
    zindex = 1
}

# Previous
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then printf '󰒮'; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl previous
    position = 710, 35
    halign = center
    valign = bottom
}

# Play/Pause
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --status; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl play-pause
    position = 760, 35
    halign = center
    valign = bottom
}

# Next
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then printf '󰒭'; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl next
    position = 810, 35
    halign = center
    valign = bottom
}

# Current position
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --position; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Open Sans SemiBold
    position = 600, 76
    halign = center
    valign = bottom
}

# Total length
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --length; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Open Sans SemiBold
    position = 920, 76
    halign = center
    valign = bottom
}

# Progress bar
label {
    monitor =
    text = cmd[update:1000] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --progress-bar; fi
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Open Sans SemiBold
    position = 760, 75
    halign = center
    valign = bottom
}

