general {
    immediate_render = true
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/default.png
    color = rgba(25, 20, 20, 1.0)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 0 # 0 disables blurring
    blur_size = 2
    noise = 0
    contrast = 0
    bcenterness = 0
    vibrancy = 0
    vibrancy_darkness = 0.0
}

# WIFI
label {
    monitor =
    #text = cmd[update:1000] echo "$(~/.config/Scripts/network-status)"
    text = cmd[update:1000] echo "$(~/.config/Scripts/network-status)​"
    color = rgba(255, 255, 255, 0.90)
    font_size = 16
    font_family = JetBrainsMonoNF
    position = -20, 0
    halign = right
    valign = top
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/Scripts/battery-status)​"
    color = rgba(255, 255, 255, 0.90)
    font_size = 16
    font_family = Open Sans
    position = -60, 0
    halign = right
    valign = top
}

# LAYOUT
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/Scripts/layout-status)​"
    color = rgba(255, 255, 255, 0.90)
    font_size = 16
    font_family = Open Sans
    position = -90, 0
    halign = right
    valign = top
}

input-field {
    monitor =
    size = 200, 35

    outline_thickness = 1

    dots_size = 0.25
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1

    # Glass background
    inner_color = rgba(255, 255, 255, 0.12)

    # Very subtle glass border
    outer_color = rgba(255, 255, 255, 0.25)

    font_color = rgba(255, 255, 255, 0.90)
    font_size = 14

    fade_on_empty = false

    placeholder_text = <span foreground="##ffffff">Enter Password</span>

    hide_input = false

    check_color = rgba(204, 136, 34, 0)
    fail_color = rgba(204, 34, 34, 0)
    
    color = rgba(242, 243, 244, 0.75)
    
    position = 0, -444

    haligh = right
    valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(255, 255, 255, 0.90)
  font_size = 20
  font_family = Open Sans Bold
  position = 0, 405
  haligh = right
  valign = center
}

label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%k:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 93
  font_family = Open Sans SemiBold
  position = 0, 310
  haligh = right
  valign = center
}

label {
    monitor =
    text = Manoj
    #color = rgba(242, 243, 244, 0.75)
    color = rgba(255, 255, 255, 0.90)
    font_size = 13
    font_family = Open Sans SemiBold
    position = 0, -407
    haligh = right
    valign = center
}

