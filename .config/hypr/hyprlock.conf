image {
    monitor =
    path = ~/Pictures/Logo/L.jpg 
    border_color = 0xffdddddd
    border_size = 0
    size = 73
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -353
    haligh = right
    valign = center
}

# ============================================================================
# Music Player Widget
# ============================================================================

# Album Art
image {
    monitor =
    path = cmd[update:2] if [[ "$(~/.config/hypr/Scripts/hyprlock-music.sh --visible)" == "1" ]]; then ~/.config/hypr/Scripts/hyprlock-music.sh --art; fi
    size = 100
    rounding = 5
    border_size = 3
    border_color = rgba(216, 222, 233, 0.70)
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/Scripts/hyprlock-music.sh --art
    position = 520, 40
    halign = center
    valign = bottom
    zindex = 1
}

